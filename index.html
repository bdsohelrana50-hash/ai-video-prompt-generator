<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Video Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#fff;font-family:Arial,sans-serif;padding:18px}
.container{max-width:650px;margin:auto}
h1{text-align:center;color:#62d9ff}
.card{background:#1c293b;padding:18px;border-radius:14px;margin:16px 0}
label{display:block;margin:14px 0 7px}
input,select,button{width:100%;padding:13px;border-radius:9px;border:1px solid #52647c;background:#101827;color:white;font-size:16px}
button{background:#087fce;border:0;font-weight:bold;margin-top:15px}
button:disabled{opacity:.5}
canvas{width:100%;background:#080d15;border-radius:10px;margin-top:12px}
#status{color:#8ee8a5;text-align:center;word-break:break-word}
small{color:#b8c5d6;line-height:1.5}
</style>
</head>
<body>
<div class="container">
<h1>🎬 AI Video Studio</h1>
<p style="text-align:center">Create videos from your photos</p>

<div class="card">
<h3>📸 Photo to Video Maker</h3>

<label>Select Photos</label>
<input type="file" id="photos" accept="image/*" multiple>

<label>Video Size</label>
<select id="ratio">
<option value="9:16">9:16 - Reels / Shorts</option>
<option value="16:9">16:9 - YouTube</option>
<option value="1:1">1:1 - Facebook Post</option>
</select>

<label>Each Photo Duration</label>
<select id="duration">
<option value="2">2 seconds</option>
<option value="3" selected>3 seconds</option>
<option value="4">4 seconds</option>
<option value="5">5 seconds</option>
</select>

<label>Video Caption (Optional)</label>
<input id="caption" placeholder="Write your video caption">

<label>Background Music (Optional)</label>
<input type="file" id="music" accept="audio/*">

<button id="preview">Preview Video</button>
<button id="export">Create & Download Video</button>
<p id="status">Select photos to begin.</p>
<canvas id="screen" width="360" height="640"></canvas>
<small>Note: This creates a slideshow video from your photos. It does not generate AI motion. Export format depends on your browser; WebM is supported on many Android browsers.</small>
</div>

<div class="card">
<h3>✨ AI Video Prompt Generator</h3>
<label>Describe Your Story</label>
<input id="story" placeholder="A cute cat playing in a garden">

<label>Video Style</label>
<select id="style">
<option>Realistic</option>
<option>Cinematic</option>
<option>Cartoon</option>
<option>3D Animation</option>
<option>Documentary</option>
</select>

<label>Aspect Ratio</label>
<select id="promptRatio">
<option>9:16 Vertical</option>
<option>16:9 Landscape</option>
<option>1:1 Square</option>
</select>

<label>Duration</label>
<select id="promptDuration">
<option>8 seconds</option>
<option>15 seconds</option>
<option>30 seconds</option>
<option>60 seconds</option>
</select>

<button id="generate">Generate Prompt</button>
<textarea id="result" rows="7" style="width:100%;margin-top:12px;background:#101827;color:white;padding:12px;border-radius:9px" placeholder="Your prompt will appear here"></textarea>
<button id="copy">Copy Prompt</button>
</div>
</div>

<script>
const photos=document.getElementById('photos');
const canvas=document.getElementById('screen');
const ctx=canvas.getContext('2d');
const status=document.getElementById('status');
let images=[];

photos.addEventListener('change',()=>{
 images=[];
 const files=[...photos.files].filter(f=>f.type.startsWith('image/'));
 if(!files.length){status.textContent='Please select photos.';return;}
 let loaded=0;
 files.forEach(file=>{
  const img=new Image();
  img.onload=()=>{
   images.push(img);
   loaded++;
   if(loaded===files.length){
    status.textContent=images.length+' photos ready!';
    drawImage(images[0]);
   }
  };
  img.src=URL.createObjectURL(file);
 });
});

function dimensions(){
 const ratio=document.getElementById('ratio').value;
 if(ratio==='16:9')return [640,360];
 if(ratio==='1:1')return [500,500];
 return [360,640];
}

function drawImage(img){
 const [w,h]=dimensions();
 canvas.width=w;canvas.height=h;
 ctx.fillStyle='#080d15';
 ctx.fillRect(0,0,w,h);
 const scale=Math.max(w/img.width,h/img.height);
 const iw=img.width*scale,ih=img.height*scale;
 ctx.drawImage(img,(w-iw)/2,(h-ih)/2,iw,ih);
 const caption=document.getElementById('caption').value;
 if(caption){
  ctx.fillStyle='rgba(0,0,0,.6)';
  ctx.fillRect(0,h-75,w,75);
  ctx.fillStyle='white';
  ctx.font='bold 24px Arial';
  ctx.textAlign='center';
  ctx.fillText(caption.slice(0,55),w/2,h-30);
 }
}

function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms));}

document.getElementById('preview').onclick=async()=>{
 if(!images.length){status.textContent='Please select photos first.';return;}
 status.textContent='Preview playing...';
 for(const img of images){
  drawImage(img);
  await wait(Number(document.getElementById('duration').value)*1000);
 }
 status.textContent='Preview finished!';
};

document.getElementById('export').onclick=async()=>{
 if(!images.length){status.textContent='Please select photos first.';return;}
 if(!window.MediaRecorder||!canvas.captureStream){
  status.textContent='Video recording is not supported by this browser.';
  return;
 }
 const button=document.getElementById('export');
 button.disabled=true;
 let audioContext=null;
 let audioElement=null;
 let stream=canvas.captureStream(30);

 try{
  const musicFile=document.getElementById('music').files[0];
  if(musicFile){
   audioElement=new Audio(URL.createObjectURL(musicFile));
   audioElement.loop=true;
   audioContext=new AudioContext();
   await audioContext.resume();
   const source=audioContext.createMediaElementSource(audioElement);
   const destination=audioContext.createMediaStreamDestination();
   source.connect(destination);
   source.connect(audioContext.destination);
   destination.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
  }

  const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
   ?'video/webm;codecs=vp9':'video/webm';
  const recorder=new MediaRecorder(stream,{mimeType:mime});
  const chunks=[];
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};

  const finished=new Promise(resolve=>{
   recorder.onstop=resolve;
  });

  recorder.start();
  if(audioElement)await audioElement.play();

  const seconds=Number(document.getElementById('duration').value);
  for(let i=0;i<images.length;i++){
   drawImage(images[i]);
   status.textContent='Creating video: '+(i+1)+' / '+images.length;
   await wait(seconds*1000);
  }

  if(audioElement)audioElement.pause();
  recorder.stop();
  await finished;

  const blob=new Blob(chunks,{type:'video/webm'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='my-video.webm';
  document.body.appendChild(a);
  a.click();
  a.remove();
  status.textContent='Video created! Check your Downloads folder.';
  setTimeout(()=>URL.revokeObjectURL(url),60000);

 }catch(error){
  status.textContent='Could not create video: '+error.message;
 }finally{
  if(audioContext)await audioContext.close();
  button.disabled=false;
 }
};

document.getElementById('generate').onclick=()=>{
 const story=document.getElementById('story').value.trim();
 if(!story){alert('Please describe your story first.');return;}
 const style=document.getElementById('style').value;
 const ratio=document.getElementById('promptRatio').value;
 const duration=document.getElementById('promptDuration').value;
 document.getElementById('result').value=
 `Create a ${duration} ${style} video. Story: ${story}. 
Aspect ratio: ${ratio}. High quality visuals, natural movement, detailed environment, consistent characters, realistic lighting and professional editing.`;
};

document.getElementById('copy').onclick=async()=>{
 const result=document.getElementById('result');
 if(!result.value){alert('Generate a prompt first.');return;}
 try{
  await navigator.clipboard.writeText(result.value);
  alert('Prompt copied!');
 }catch(e){
  result.select();
  document.execCommand('copy');
  alert('Prompt copied!');
 }
};
</script>
</body>
  </html>
