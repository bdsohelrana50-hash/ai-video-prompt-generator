
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Video Prompt Generator</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:20px;
  font-family:Arial,sans-serif;
  background:#101827;color:white;
}
.container{
  max-width:650px;margin:25px auto;
  background:#1c293b;padding:24px;
  border-radius:18px;
  box-shadow:0 8px 30px #0005;
}
h1{text-align:center;color:#65d6ff}
p{text-align:center;color:#b8c6d8}
label{display:block;margin-top:18px;margin-bottom:7px}
input,textarea,select{
  width:100%;padding:13px;
  border:1px solid #52647c;
  border-radius:9px;background:#101827;
  color:white;font-size:16px;
}
textarea{min-height:110px;resize:vertical}
button{
  width:100%;padding:14px;margin-top:18px;
  border:0;border-radius:10px;
  background:#16a56b;color:white;
  font-size:17px;font-weight:bold;
}
button.copy{background:#2878d0}
#result{
  display:none;margin-top:22px;
  padding:15px;background:#101827;
  border:1px solid #52647c;
  border-radius:10px;white-space:pre-wrap;
  line-height:1.6;overflow-wrap:anywhere;
}
.footer{text-align:center;font-size:12px;color:#8192a8;margin-top:22px}
</style>
</head>
<body>
<div class="container">
  <h1>🎬 AI Video Prompt Generator</h1>
  <p>Create amazing video prompts easily!</p>

  <label>📝 Describe Your Story</label>
  <textarea id="story" placeholder="Example: A mother cat and her kitten discover a moving toy..."></textarea>

  <label>🎨 Video Style</label>
  <select id="style">
    <option>Ultra Realistic</option>
    <option>Cinematic Drama</option>
    <option>Funny and Cute</option>
    <option>Cartoon Animation</option>
    <option>Documentary Style</option>
    <option>Realistic Smartphone Footage</option>
  </select>

  <label>⏱️ Video Duration</label>
  <select id="duration">
    <option>8 seconds</option>
    <option>15 seconds</option>
    <option>30 seconds</option>
    <option>60 seconds</option>
  </select>

  <label>📱 Aspect Ratio</label>
  <select id="ratio">
    <option>9:16 Vertical</option>
    <option>16:9 Horizontal</option>
    <option>1:1 Square</option>
  </select>

  <label>🌎 Prompt Language</label>
  <select id="language">
    <option>English</option>
    <option>Bangla</option>
  </select>

  <label>🎤 Dialogue or Voiceover (Optional)</label>
  <input id="voice" placeholder="Write dialogue or voiceover here">

  <button onclick="generatePrompt()">✨ Generate Video Prompt</button>

  <div id="result"></div>
  <button class="copy" id="copyBtn" onclick="copyPrompt()" style="display:none">📋 Copy Prompt</button>

  <div class="footer">My First AI Video Tool ❤️</div>
</div>

<script>
function generatePrompt(){
  const story=document.getElementById("story").value.trim();
  if(!story){
    alert("Please describe your video story first!");
    return;
  }

  const style=document.getElementById("style").value;
  const duration=document.getElementById("duration").value;
  const ratio=document.getElementById("ratio").value;
  const language=document.getElementById("language").value;
  const voice=document.getElementById("voice").value.trim();

  let prompt="Create a "+duration+" video in "+ratio+" aspect ratio.\n\n";
  prompt+="STORY:\n"+story+"\n\n";
  prompt+="VISUAL STYLE:\n"+style+". High quality visuals, natural movements, consistent characters, detailed environment and realistic expressions.\n\n";
  prompt+="CAMERA:\nUse appropriate camera angles, smooth natural movement and clear framing. Keep the main subject visible throughout the video.\n\n";
  prompt+="AUDIO:\n";
  prompt+=voice ? voice : "Use suitable natural background sounds and appropriate audio.";
  prompt+="\n\n";
  prompt+="IMPORTANT:\nKeep the story visually consistent. Avoid distorted faces, extra limbs, unwanted text, sudden character changes and unnatural movements.\n";

  if(language==="Bangla"){
    prompt="ভিডিওর নির্দেশনা বাংলায় অনুসরণ করো।\n\n"+prompt;
  }

  document.getElementById("result").textContent=prompt;
  document.getElementById("result").style.display="block";
  document.getElementById("copyBtn").style.display="block";
}

function copyPrompt(){
  const text=document.getElementById("result").textContent;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      alert("Prompt copied successfully!");
    }).catch(()=>{
      alert("Please select and copy the prompt manually.");
    });
  }else{
    alert("Please select and copy the prompt manually.");
  }
}
</script>
</body>
</html>
